name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check syntax
        run: |
          node --check app/static/app.js
          node --check app/static/crypto.js
          node --check app/static/localcsv.js
      - run: node --test tests/*.test.cjs

  docker:
    name: Core Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker compose --profile tools --profile crypto config --quiet
      - run: docker build --tag chimera:ci .
      - name: Check core HTTP API
        shell: bash
        run: |
          docker run -d --name chimera-ci -p 127.0.0.1:8000:8000 chimera:ci
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          curl --fail --silent http://127.0.0.1:8000/ > /dev/null
      - name: Container logs
        if: failure()
        run: docker logs chimera-ci
      - name: Cleanup
        if: always()
        run: docker rm --force chimera-ci || true
